 M8 16h6',print:'M6 9V3h12v6 M6 17H3V9h18v8h-3 M6 14h12v8H6z',upload:'M12 16V3 M7 8l5-5 5 5 M4 17v4h16v-4',link:'M10 13a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-2 2 M14 11a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l2-2',balance:'M12 3v18 M5 21h14 M3 7h18 M5 7l-4 8h8z M19 7l-4 8h8z',history:'M3 3v6h6 M3 9a9 9 0 1 1 0 7 M12 7v5l3 2',checkcircle:'M22 11.1V12a10 10 0 1 1-5.9-9.1 M22 4L12 14l-3-3'};

const numberFormats=new Map();

const dateLabel=(d,long=false)=>(long?longDateFormat:shortDateFormat).format(dateAt(d));
const dayLabel=d=>weekdayFormat.format(dateAt(d));

const target=e=>35.5*e.percent/100*6;
const assigned=(s,d,k)=>s.employees.filter(e=>get(s,e.id,d)===k);
const count=(s,d,k)=>assigned(s,d,k).length;

function skillAvailable(s,e,d,k,skill){

 return !s.restrictions.some(r=>r.employee===e.id&&r.skill===skill&&begin<(r.end+1)*1440&&end>r.start*1440);

function skillStatus(s,people,d,k){return Object.keys(SKILLS).map(skill=>({skill,label:SKILLS[skill],need:s.rules.skills[k][skill],have:people.filter(e=>skillAvailable(s,e,d,k,skill)).length}));}

function pairPenalty(s){return s.pairs.filter(p=>p.mode==='limit').reduce((n,p)=>n+Math.max(0,pairCount(s,p)-p.limit),0);}

 if(!SHIFTS[k])return ['Ukjent vakttype.'];

 if(!e.allowed.includes(k))errors.push('Medarbeideren er ikke satt opp for denne vakttypen.');

 if(s.requests.some(r=>r.employee===e.id&&r.status==='approved'&&begin<(r.end+1)*1440&&end>r.start*1440))errors.push('Godkjent fravær overlapper vakten, inkludert eventuell tid etter midnatt.');
 for(let i=Math.max(0,d-2);i<Math.min(DAYS,d+3);i++){

 }
 for(let start=Math.max(0,d-6);start<=d&&start<=DAYS-7;start++){

 }

 for(const p of s.pairs.filter(p=>p.mode==='avoid')){const other=p.a===e.id?p.b:p.b===e.id?p.a:null;if(other&&get(s,other,d)===k)errors.push('Kombinasjonen er sperret i avdelingens eksempelregler.');}

function scheduleMarkup(){const from=ui.week*7,to=Math.min(DAYS,from+ui.span),days=Array.from({length:to-from},(_,i)=>i+from),emps=employeeList();return `<table class="schedule" style="${ui.span===14?'min-width:1120px':''}"><caption class="sr-only">Turnus for ${dateLabel(from)} til ${dateLabel(to-1)} 2026. Trykk på en vakt for å endre.</caption><thead><tr><th scope="col">MEDARBEIDER</th>${days.map(d=>`<th scope="col" class="${weekend(d)?'day-weekend':''}"><button class="day-title ${d===TODAY?'today':''}" data-action="day" data-day="${d}" aria-label="Se bemanning ${dayLabel(d)} ${dateLabel(d)}"><span>${dayLabel(d).slice(0,3).toUpperCase()}</span><strong>${dateAt(d).getUTCDate()}</strong></button></th>`).join('')}<th scope="col">TIMER</th></tr></thead><tbody>${emps.map(e=>`<tr><td><button class="employee-cell" data-action="employee" data-id="${e.id}" aria-label="Rediger ${esc(e.name)}">${avatar(e)}<span><span class="emp-name">${esc(e.name)}</span><span class="emp-role">${esc(e.role)} · ${e.percent} %</span></span></button></td>${days.map(d=>`<td class="${weekend(d)?'weekend':''} ${d===TODAY?'today-col':''}">${shiftCell(e,d)}</td>`).join('')}<td class="hours-cell">${num(hours(state,e.id,from,to),1)}<small>av ${num(35.5*e.percent/100*days.length/7,1)} t*</small></td></tr>`).join('')||`<tr><td colspan="${days.length+2}">${empty('Ingen treff','Prøv et annet navn eller en annen faggruppe.','search')}</td></tr>`}</tbody><tfoot><tr><td>Bemanning · hele avdelingen</td>${days.map(d=>{let n=0,total=0;for(const k of Object.keys(SHIFTS)){n+=Math.min(count(state,d,k),needed(state,d,k));total+=needed(state,d,k);}return `<td class="${n<total?'coverage-short':''}">${n} / ${total}${n<total?' · !':''}</td>`}).join('')}<td></td></tr></tfoot></table>`;}
function planPage(){const m=metrics(state);return pageHead('Turnusplan',`En god plan for hele laget. <span class="nowrap">19. oktober – 29. november 2026</span>`,button('Eksporter','export','download')+button('Lag turnusforslag','generate','spark','primary'),'PLANLEGGING · HØSTEN 2026')+topMetrics(m)+needsBanner(m)+`<section class="panel"><div class="calendar-top"><div class="period"><div class="arrow-group"><button class="icon-btn" data-action="prev-week" aria-label="Forrige uke" ${ui.week===0?'disabled':''}>${icon('left')}</button><button class="icon-btn" data-action="next-week" aria-label="Neste uke" ${ui.week>=6-ui.span/7?'disabled':''}>${icon('chevron')}</button></div><div><strong>Uke ${43+ui.week}${ui.span===14?'–'+(44+ui.week):''}<span style="font-weight:400;color:#bac3b1;margin:0 8px">/</span>${dateLabel(ui.week*7)} – ${dateLabel(Math.min(DAYS-1,ui.week*7+ui.span-1))}</strong><small>${state.reviewed?'Gjennomgått i demoen':'Utkast'} · versjon ${state.revision} · ${planChanges(state).length} endrede ruter fra grunnturnus</small></div></div><div class="actions"><div class="segmented" aria-label="Visningsperiode"><button class="${ui.span===7?'active':''}" data-action="span" data-span="7" aria-pressed="${ui.span===7}">1 uke</button><button class="${ui.span===14?'active':''}" data-action="span" data-span="14" aria-pressed="${ui.span===14}">2 uker</button></div>${button('Grunnturnus','baseline','copy','sm')+button('Hele perioden','period','calendar','sm')}</div></div>${filterBar(employeeList().length+' av '+state.employees.length+' medarbeidere')}<div class="schedule-scroll" id="scheduleScroll">${scheduleMarkup()}</div><div class="calendar-bottom"><div class="legend">${[['D','Dag'],['K','Kveld'],['N','Natt'],['F','Ferie / fri'],['S','Fravær'],['C','Kurs']].map(([k,t])=>`<span class="legend-item"><i class="legend-dot ${k}">${k}</i>${t}</span>`).join('')}<span class="legend-item">${icon('lock','lock')} Låst</span></div><small>* Veiledende ukemåltall · 35,5 t i 100 %</small></div><div class="review-strip"><div><strong>${state.reviewed?'Gjennomgangen er registrert i denne nettleseren':'Du kjenner laget. Du har siste ord.'}</strong><p>Se over forslag, ønsker og bemanning før du markerer utkastet som gjennomgått.</p></div>${button(state.reviewed?'Gjennomgått':'Gjennomgå utkast','review','checkcircle','sm')}</div></section><div class="two-columns"><section class="panel"><div class="panel-head"><h3>Det lille som gjør en forskjell</h3>${badge('Planleggingshjelp')}</div><div class="panel-body"><div class="insight-item"><span class="icon-box">${icon('heart')}</span><div><strong>${m.wishesMet} av ${m.wishes} friønsker er oppfylt i planen</strong><p>Du kan behandle ønskene og låse avtalte fridager.</p></div>${textButton('Se ønsker','nav','data-page="requests"')}</div><div class="insight-item"><span class="icon-box purple">${icon('balance')}</span><div><strong>Se hvordan belastningen fordeler seg</strong><p>Sammenlign netter, helger og timer i seksukersperioden.</p></div>${textButton('Se innsikt','nav','data-page="insights"')}</div></div></section><section class="panel"><div class="panel-head"><h3>Bemanning gjennom perioden</h3><span class="small muted">Vaktdekning</span></div><div class="panel-body" style="padding-top:8px">${weekBars()}<p class="notice-inline">Dekning måles mot bemanningsbehovet som er lagt inn.</p></div></section></div>`;}
function weekBars(){return `<div class="week-bars">${Array.from({length:6},(_,w)=>{let n=0,total=0;for(let d=w*7;d<w*7+7;d++)for(const k of Object.keys(SHIFTS)){n+=Math.min(count(state,d,k),needed(state,d,k));total+=needed(state,d,k);}const percent=total?n/total*100:100;return `<div class="week-bar"><strong>${num(percent,0)} %</strong><div class="bar-stack ${w===ui.week?'active':''}" style="height:${Math.max(4,percent*.75)}px"></div><small>Uke ${43+w}</small></div>`;}).join('')}</div>`;}
function activityMarkup(){return state.activity.slice(0,5).map(a=>`<div class="activity"><strong>${esc(a.text)}</strong><small>${esc(a.at)}</small></div>`).join('');}
function overviewPage(){const m=metrics(state),pending=state.requests.filter(r=>r.status==='pending');return pageHead('Godt å ha oversikt.',`Her er det laget ditt trenger. Demoen viser tirsdag 20. oktober.`,button('Åpne turnusen','nav','calendar','primary','data-page="plan"'),'SOLSIDEN DØGNENHET · ARBEIDSROM')+`<section class="hero"><div><div class="eyebrow">PLANLEGG MED OMTANKE</div><h2>Rett kompetanse.<br>Et lag som fungerer.</h2><p>Samle bemanningsbehov, ansattes ønsker og avdelingens rammer. Utforsk forslagene, og ta beslutningen med hele bildet foran deg.</p>${button('Utforsk turnusforslaget','nav','arrow','lime','data-page="plan"')}</div><div class="hero-art" aria-hidden="true"><div class="art-card"><div class="art-lines"></div></div><div class="art-card"><div class="art-lines"></div></div><div class="art-card">${icon('check')}</div></div></section>`+topMetrics(m)+needsBanner(m)+`<div class="two-columns"><section class="panel"><div class="panel-head"><div><h3>Laget på jobb</h3><p>Tirsdag 20. oktober · eksempeldata</p></div>${textButton('Se dagen','day',`data-day="${TODAY}"`)}</div><div class="panel-body">${Object.keys(SHIFTS).map(k=>{const team=assigned(state,TODAY,k);return `<div class="day-team"><div class="day-team-head"><strong><i class="legend-dot ${k}">${k}</i> ${SHIFTS[k].name}</strong><span class="muted small">${SHIFTS[k].time} · ${team.length}/${needed(state,TODAY,k)}</span></div>${skillBadges(state,team,TODAY,k)}<div class="team-avatars">${team.map(e=>`<span title="${esc(e.name)}">${avatar(e)}</span>`).join('')}<span>${team.map(e=>esc(e.name.split(' ')[0])).join(', ')}</span></div></div>`;}).join('')}</div></section><section class="panel"><div class="panel-head"><h3>Til oppfølging</h3>${badge(pending.length+' ønsker venter','warn')}</div><div class="panel-body">${pending.length?pending.slice(0,3).map(r=>{const e=empById(state,r.employee);return `<div class="insight-item">${avatar(e)}<div><strong>${esc(e.name)} ønsker fri</strong><p>${dateLabel(r.start)}${r.end!==r.start?' – '+dateLabel(r.end):''}</p></div>${textButton('Vurder','request-detail',`data-id="${r.id}"`)}</div>`;}).join(''):'<p class="empty-small">Alle ønsker er behandlet.</p>'}<div class="insight-item"><span class="icon-box">${icon('sliders')}</span><div><strong>Rammene kommer først</strong><p>Se bemanning, arbeidstid og kompetansekrav.</p></div>${textButton('Se regler','nav','data-page="rules"')}</div></div></section></div><div class="two-columns"><section class="panel"><div class="panel-head"><h3>Siste aktivitet</h3>${badge('Denne nettleseren')}</div><div class="panel-body">${activityMarkup()}</div></section><section class="panel"><div class="panel-head"><h3>Slik prøver du VaktLaget</h3></div><div class="panel-body"><ol class="help-list"><li><strong>Løs et fravær.</strong> Finn en kandidat til den åpne kveldsvakten.</li><li><strong>Prøv en endring.</strong> Klikk på en vakt, eller legg inn et ønske om fri.</li><li><strong>Lag et nytt forslag.</strong> Se hvordan de samme rammene kan gi ulike planer.</li></ol>${button('Hva synes du, Erik?','feedback','message','sm')}</div></section></div>`;}
function employeesPage(){const emps=employeeList();return pageHead('Menneskene i laget.',`${state.employees.length} fiktive medarbeidere. Kompetansen og ønskene som former en god turnus.`,button('Legg til medarbeider','employee','plus','primary'),'MEDARBEIDERE · KOMPETANSE OG KAPASITET')+`<div class="metrics">${metric('Medarbeidere',state.employees.length,'',`${num(state.employees.reduce((a,e)=>a+e.percent/100,0),1)} årsverk i eksempelet`,'people','emphasis')}${metric('Medisinkompetanse',state.employees.filter(e=>e.medication).length,'','Eksempel på godkjent kompetanse','shield')}${metric('Erfarne kolleger',state.employees.filter(e=>e.experienced).length,'','Kan støtte mindre erfarne kolleger','heart')}${metric('Nattlaget',state.employees.filter(isNight).length,'','Medarbeidere med faste nattevakter','moon')}</div><section class="panel"><div class="panel-head"><div><h3>Hele laget</h3><p>Klikk på en medarbeider for å justere eksempeldataene.</p></div>${badge('19. okt. – 29. nov.')}</div><div style="padding-top:15px">${filterBar(emps.length+' medarbeidere')}</div><div class="table-wrap"><table class="data-table"><thead><tr><th>Medarbeider</th><th>Stilling</th><th>Kompetanse</th><th>Vakttyper</th><th>Timer / måltall*</th><th><span class="sr-only">Handling</span></th></tr></thead><tbody>${emps.map(e=>`<tr><td><div class="person">${avatar(e)}<div><strong>${esc(e.name)}</strong><small>${esc(e.role)}</small></div></div></td><td>${e.percent} %</td><td><div class="tags">${e.medication?badge('Medisin','blue'):''}${e.experienced?badge('Erfaren'):badge('Under opplæring','warn')}${e.response?badge('Beredskap','purple'):''}${state.restrictions.some(r=>r.employee===e.id)?badge('Tilrettelegging','warn'):''}</div></td><td><div class="tags">${e.allowed.map(k=>`<i class="legend-dot ${k}">${k}</i>`).join('')}</div></td><td>${num(hours(state,e.id),1)} <span class="muted">/ ${num(target(e),1)} t</span><div class="progress"><i style="width:${Math.min(100,hours(state,e.id)/target(e)*100)}%"></i></div></td><td><button class="icon-btn" data-action="employee" data-id="${e.id}" aria-label="Rediger ${esc(e.name)}">${icon('edit')}</button></td></tr>`).join('')||'<tr><td colspan="6">'+empty('Ingen treff','Prøv et annet søk.','search')+'</td></tr>'}</tbody></table></div><div class="panel-body note" style="border-radius:0">* Måltallet er stillingsprosent × 35,5 timer × 6 uker. Ferie, kurs og avtalespesifikke beregninger er ikke trukket fra. Det brukes som et veiledende fordelingsmål.</div></section>`;}
function requestStatus(r){return r.status==='approved'?badge('Godkjent'):r.status==='rejected'?badge('Avslått','danger'):badge('Venter på svar','warn');}
function restrictionsMarkup(){return `<section class="panel" style="margin-top:20px"><div class="panel-head"><div><h3>På jobb med tilrettelegging</h3><p>Medarbeideren beholder vakten, men teller ikke med i valgt oppgave i perioden.</p></div>${button('Legg til','restriction-new','plus','sm')}</div><div class="panel-body">${state.restrictions.map(r=>`<div class="pair-row"><span class="icon-box">${icon('sliders')}</span><div><strong>${esc(empById(state,r.employee).name)}</strong><p class="small muted">Teller ikke med i ${r.skill==='response'?'beredskap':'medisinkompetanse'} · ${dateLabel(r.start)}–${dateLabel(r.end)}</p></div><button class="icon-btn" data-action="restriction-remove" data-id="${esc(r.id)}" aria-label="Fjern tilrettelegging for ${esc(empById(state,r.employee).name)}">${icon('trash')}</button></div>`).join('')||'<p class="empty-small">Ingen tilrettelegging er registrert.</p>'}<p class="notice-inline">Registrer funksjon og datoer, uten diagnose eller privat begrunnelse. Bruk bare fiktive opplysninger i demoen.</p></div></section>`;}
function restrictionDialog(id){openDialog('Tilrettelegging i en periode','Tilgjengelig på jobb, med en avgrenset oppgavebegrensning.',`<form id="restrictionForm"><div class="field"><label for="restrictionEmployee">Medarbeider</label><select id="restrictionEmployee" name="employee">${employeeOptions(id)}</select></div><div class="field" style="margin-top:16px"><label for="restrictionSkill">Teller ikke med i</label><select id="restrictionSkill" name="skill"><option value="response">Beredskapslaget ved utagering</option><option value="medication">Kravet til medisinkompetanse</option></select></div><div class="form-grid" style="margin-top:16px"><div class="field"><label for="restrictionStart">Fra og med</label><input id="restrictionStart" name="start" type="date" min="${isoAt(0)}" max="${isoAt(DAYS-1)}" value="${isoAt(TODAY)}" required></div><div class="field"><label for="restrictionEnd">Til og med</label><input id="restrictionEnd" name="end" type="date" min="${isoAt(0)}" max="${isoAt(DAYS-1)}" value="${isoAt(TODAY+6)}" required></div></div><div class="note" style="margin-top:20px">Vaktene blir stående. Kompetansedekningen kontrolleres på nytt, også for nattevakter som går inn i perioden. Begrensningen gjelder hele den overlappende vakten i demoen.</div><div id="formError"></div></form>`,cancel()+`<button class="btn primary" type="submit" form="restrictionForm">${icon('check')}Lagre tilrettelegging</button>`);}
function requestsPage(){const pending=state.requests.filter(r=>r.status==='pending').length,list=state.requests.filter(r=>ui.requestFilter==='all'||r.status===ui.requestFilter);return pageHead('Rom for livet utenfor.', 'Fravær og ønsker samlet på ett sted. Godkjent fravær sperrer datoene i demoen.',button('Tilrettelegging','restriction-new','sliders')+button('Registrer fravær / ønske','request-new','plus','primary'),'FRAVÆR & ØNSKER · OVERSIKT')+`<div class="metrics">${metric('Til behandling',pending,'','Ønsker som venter på din vurdering','heart','emphasis')}${metric('Godkjente oppføringer',state.requests.filter(r=>r.status==='approved').length,'','Ferie, fravær og innvilget fri','checkcircle')}${metric('Ønsker oppfylt i planen',metrics(state).wishesMet,`av ${metrics(state).wishes}`,'Uavhengig av behandlingsstatus','calendar')}${metric('Vakter til oppfølging',gaps(state).length,'','Bemanning eller kompetanse mangler','people')}</div><section class="panel"><div class="panel-head"><h3>Fravær og friønsker</h3><div class="segmented">${[['all','Alle'],['pending','Venter'],['approved','Godkjent'],['rejected','Avslått']].map(([k,l])=>`<button class="${ui.requestFilter===k?'active':''}" data-action="request-filter" data-filter="${k}" aria-pressed="${ui.requestFilter===k}">${l}</button>`).join('')}</div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Medarbeider</th><th>Type</th><th>Periode</th><th>Status</th><th>Handling</th></tr></thead><tbody>${list.map(r=>{const e=empById(state,r.employee);return `<tr><td><div class="person">${avatar(e)}<div><strong>${esc(e.name)}</strong><small>${esc(e.role)}</small></div></div></td><td>${TYPES[r.type].label}</td><td>${dateLabel(r.start)}${r.end!==r.start?' – '+dateLabel(r.end):''}<small class="muted" style="display:block">${r.end-r.start+1} ${r.end===r.start?'dag':'dager'}</small></td><td>${requestStatus(r)}</td><td>${button(r.status==='pending'?'Vurder':'Se detaljer','request-detail',r.status==='pending'?'arrow':'calendar','sm',`data-id="${r.id}"`)}</td></tr>`;}).join('')||'<tr><td colspan="5">'+empty('Ingen oppføringer her','Nye fravær og ønsker vil vises i oversikten.','heart')+'</td></tr>'}</tbody></table></div></section><div class="note">${icon('help')} <strong>En forespørsel er et ønske. En godkjenning er en sperre.</strong> Når du godkjenner fravær, fjernes eventuelle vakter på datoene, også låste vakter. Vaktbehovet blir stående, så du kan finne erstattere.</div>`+restrictionsMarkup();}
function rulesPage(){const r=state.rules;return pageHead('Gode rammer. Bedre forslag.', 'Definer bemanningen og hensynene som turnusforslaget skal bygge på.',button('Lagre eksempelregler','save-rules','check','primary'),'REGLER & BEMANNING · EKSEMPELOPPSETT')+`<div class="banner info">${icon('help')}<div class="banner-content"><strong>Dette er forenklede eksempelregler</strong><p>Full lov- og tariffkontroll, ukentlig sammenhengende hvile og arbeid utenfor perioden er ikke implementert. Bruk bare fiktive data.</p></div>${button('Se omfang','help','arrow','sm')}</div><div class="two-columns"><section class="panel"><div class="panel-head"><div><h3>Arbeidstid og hvile</h3><p>Kontrolleres ved tildeling og endring av vakter.</p></div>${badge('Absolutte krav')}</div><div class="panel-body"><div class="rule-item"><div><strong>Hvile mellom to vakter</strong><p>Avstand fra sluttid til neste starttid.</p></div><label><span class="sr-only">Timer hvile</span><input id="ruleRest" type="number" min="8" max="24" step="0.5" value="${r.rest}"></label><span class="unit">timer</span></div><div class="rule-item"><div><strong>Timer i sju kalenderdager</strong><p>Rullerende sjudagersvinduer i demoperioden.</p></div><label><span class="sr-only">Maksimalt antall timer</span><input id="ruleHours" type="number" min="8" max="60" step="0.5" value="${r.maxHours}"></label><span class="unit">timer</span></div><div class="rule-item"><div><strong>Arbeidsdager på rad</strong><p>Antall sammenhengende datoer med en vakt.</p></div><label><span class="sr-only">Maksimalt antall arbeidsdager</span><input id="ruleDays" type="number" min="1" max="7" step="1" value="${r.maxDays}"></label><span class="unit">dager</span></div><div class="note" style="margin-top:16px">Kompetansekravene gjelder sammensetningen av hele vaktlaget. Angi antall personer i tabellen nedenfor.</div></div></section><section class="panel"><div class="panel-head"><div><h3>Hvor mange trenger dere?</h3><p>Minimumsbemanning per vakttype.</p></div>${badge('Hele perioden')}</div><div class="panel-body"><table class="need-table"><thead><tr><th>Vakt</th><th>Mandag–fredag</th><th>Lørdag–søndag</th></tr></thead><tbody>${Object.entries(SHIFTS).map(([k,v])=>`<tr><td><i class="legend-dot ${k}">${k}</i> ${v.short}<small class="muted" style="display:block;margin-top:5px">${v.time}</small></td>${['weekday','weekend'].map(type=>`<td><label><span class="sr-only">${v.name}, ${type==='weekday'?'ukedag':'helg'}</span><input id="need-${type}-${k}" type="number" min="1" max="20" step="1" value="${r.needs[type][k]}"></label></td>`).join('')}</tr>`).join('')}</tbody></table><div class="note" style="margin-top:16px">Økt behov lager ikke flere medarbeidere. Vakter som ikke kan fylles, blir synlige i oversikten.</div></div></section></div><section class="panel"><div class="panel-head"><div><h3>Kompetanse på hver vakt</h3><p>Antall ulike medarbeidere per kompetanse. Én person kan dekke flere kompetanser.</p></div>${badge('Absolutte krav')}</div><div class="panel-body"><div class="table-wrap"><table class="need-table"><thead><tr><th>Kompetanse</th>${Object.values(SHIFTS).map(v=>`<th>${v.short}</th>`).join('')}</tr></thead><tbody>${Object.entries(SKILLS).map(([skill,label])=>`<tr><td>${label}</td>${Object.entries(SHIFTS).map(([k,v])=>`<td><label><span class="sr-only">Antall med ${label.toLowerCase()} på ${v.name.toLowerCase()}</span><input id="skill-${k}-${skill}" type="number" min="0" max="20" step="1" value="${r.skills[k][skill]}"></label></td>`).join('')}</tr>`).join('')}</tbody></table></div><div class="note" style="margin-top:16px"><strong>To med medisinkompetanse betyr to ulike personer.</strong> Sett 0 hvis kravet ikke brukes. Beredskap er et eget kompetansekrav for håndtering av utagering; midlertidig tilrettelegging tas med i opptellingen.</div></div></section><section class="panel"><div class="panel-head"><div><h3>Sammensetning av laget</h3><p>Prioriter veiledning, begrens felles vakter eller legg inn en absolutt sperre.</p></div>${button('Legg til hensyn','pair-new','plus','sm')}</div><div class="panel-body">${state.pairs.length?state.pairs.map(p=>`<div class="pair-row">${icon(p.mode==='avoid'?'shield':'people')}<span><strong>${esc(empById(state,p.a).name)}</strong> og <strong>${esc(empById(state,p.b).name)}</strong></span>${badge(p.mode==='avoid'?'Sperret kombinasjon':p.mode==='limit'?`Helst maks ${p.limit} felles vakter`:'Prioriter sammen',p.mode==='avoid'||p.mode==='limit'&&pairCount(state,p)>p.limit?'warn':'')}<span class="small muted">${pairCount(state,p)} felles i planen</span><button class="icon-btn" data-action="pair-remove" data-id="${esc(p.id)}" aria-label="Fjern sammensetningsregel">${icon('trash')}</button></div>`).join(''):'<div class="empty-small">Ingen ekstra sammensetningshensyn er lagt inn.</div>'}<p class="notice-inline">«Sperret» er et absolutt krav. «Prioriter» og «Begrens» er ønsker som kan fravikes; antallet felles vakter vises her. Kompetanse og tildelingsregler går foran slike ønsker. Kriteriene må handle om oppgavene og ha saklig grunnlag.</p></div></section><div class="note"><strong>Endrede regler flytter ikke vaktene automatisk.</strong> Lagre først, se hva kontrollen finner, og be deretter om et nytt turnusforslag. Et nytt forslag beholder låste vakter.</div>`;}
function insightsPage(){const m=metrics(state);return pageHead('Se hele bildet.', 'Forstå dekning, fordeling og timebruk før du bestemmer deg.',button('Eksporter oversikt','export','download'),'INNSIKT · 19. OKTOBER – 29. NOVEMBER')+`<div class="metrics">${metric('Dekning',num(m.coverage,1),'%',`${m.required-m.covered} ubesatte vaktplasser`,'people','emphasis')}${metric('Helgevakter',m.weekendCount,'','Fordelt på seks helger','calendar')}${metric('Nattevakter',m.night,'','Fordelt på nattlaget','moon')}${metric('Kostnadseksempel',num(Math.round(m.cost/1000)),'tusen kr','Faste demopriser · ikke lønnsgrunnlag','chart')}</div><div class="two-columns"><section class="panel"><div class="panel-head"><h3>Planlagte timer per uke</h3>${badge('Timer')}</div><div class="panel-body"><div class="chart-legend">${Object.keys(SHIFTS).map(k=>`<span><i class="bar-${k}"></i>${SHIFTS[k].short}</span>`).join('')}</div>${Array.from({length:6},(_,w)=>{const hs={D:0,K:0,N:0};for(let d=w*7;d<w*7+7;d++)for(const k of Object.keys(SHIFTS))hs[k]+=count(state,d,k)*SHIFTS[k].hours;const total=hs.D+hs.K+hs.N;return `<div class="stack-row"><span>Uke ${43+w}</span><div class="stack-track" role="img" aria-label="${num(hs.D,1)} dagtimer, ${num(hs.K,1)} kveldstimer og ${num(hs.N,1)} nattimer">${Object.keys(SHIFTS).map(k=>`<span class="bar-${k}" style="width:${total?hs[k]/total*100:0}%" title="${SHIFTS[k].short}: ${num(hs[k],1)} timer"></span>`).join('')}</div><strong>${num(total,1)} t</strong></div>`;}).join('')}</div></section><section class="panel"><div class="panel-head"><h3>Ønsker og kapasitet</h3></div><div class="panel-body"><div class="stat-row"><span>Oppfylte friønsker</span><strong>${m.wishesMet} av ${m.wishes}</strong></div><div class="stat-row"><span>Planlagte timer</span><strong>${num(m.hours,1)} t</strong></div><div class="stat-row"><span>Veiledende samlet måltall*</span><strong>${num(m.capacity,1)} t</strong></div><div class="stat-row"><span>Timer over individuelt måltall</span><strong>${num(state.employees.reduce((a,e)=>a+Math.max(0,hours(state,e.id)-target(e)),0),1)} t</strong></div><div class="note" style="margin-top:15px">* Før fradrag for ferie og kurs. Timer over måltall er ikke en beregning av juridisk overtid. Demopriser: dag 350, kveld 410 og natt 460 kr/time.</div></div></section></div><section class="panel"><div class="panel-head"><div><h3>Fordeling i laget</h3><p>Vurder fordelingen i lys av stillingsprosent, vakttyper og fravær.</p></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Medarbeider</th><th>Stilling</th><th>Planlagte timer</th><th>Dag / kveld / natt</th><th>Helgevakter</th><th>Andel av måltall</th></tr></thead><tbody>${state.employees.map(e=>{const counts={D:0,K:0,N:0};let wk=0;for(let d=0;d<DAYS;d++){const k=get(state,e.id,d);if(k){counts[k]++;if(weekend(d))wk++;}}return `<tr><td><div class="person">${avatar(e)}<div><strong>${esc(e.name)}</strong><small>${esc(e.role)}</small></div></div></td><td>${e.percent} %</td><td>${num(hours(state,e.id),1)} t</td><td>${counts.D} <span class="muted">/</span> ${counts.K} <span class="muted">/</span> ${counts.N}</td><td>${wk}</td><td>${num(hours(state,e.id)/target(e)*100)} %<div class="progress"><i style="width:${Math.min(100,hours(state,e.id)/target(e)*100)}%"></i></div></td></tr>`;}).join('')}</tbody></table></div></section>`;}
const views={overview:overviewPage,plan:planPage,employees:employeesPage,requests:requestsPage,rules:rulesPage,insights:insightsPage};
function render(){document.getElementById('nav').innerHTML=NAV.map(([id,ic,label])=>`<button class="nav-btn ${ui.page===id?'active':''}" data-action="nav" data-page="${id}" ${ui.page===id?'aria-current="page"':''}>${icon(ic)}${label}${id==='requests'&&state.requests.filter(r=>r.status==='pending').length?`<span class="nav-count">${state.requests.filter(r=>r.status==='pending').length}</span>`:''}</button>`).join('');document.getElementById('breadcrumbPage').textContent=NAV.find(n=>n[0]===ui.page)?.[2]||'Turnusplan';document.getElementById('main').innerHTML=`<div class="page-enter">${views[ui.page]()}</div><footer class="footer"><span>VaktLaget · Turnus med omtanke</span><span>Fiktive eksempeldata · Lagres i din nettleser · <button data-action="help">Om demoen</button></span></footer>`;updateSaved();}
function navigate(page){if(!views[page])return;if(ui.page==='rules'&&document.getElementById('ruleRest')&&rulesDirty()&&!confirm('Du har endret eksempelregler uten å lagre. Vil du forlate siden og forkaste endringene?'))return;ui.page=page;ui.search='';ui.role='all';closeMenu();if(location.hash!=='#'+page)history.replaceState(null,'','#'+page);render();window.scrollTo({top:0,behavior:'auto'});document.getElementById('main').focus({preventScroll:true});}
function toast(text,error=false){const el=document.createElement('div');el.className='toast'+(error?' error':'');el.innerHTML=icon(error?'alert':'checkcircle')+`<span>${esc(text)}</span>`;document.getElementById('toasts').append(el);setTimeout(()=>el.remove(),5000);}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('mobileBackdrop').classList.remove('open');}
function openDialog(title,subtitle,body,footer='',wide=false){previousFocus=document.activeElement;ui.dialog=title;document.getElementById('dialogRoot').innerHTML=`<div class="overlay" id="overlay"><section class="drawer ${wide?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" aria-describedby="dialogSubtitle" tabindex="-1"><div class="drawer-head"><div><div class="eyebrow">VAKTLAGET · DEMO</div><h2 id="dialogTitle">${title}</h2><p id="dialogSubtitle">${subtitle}</p></div><button class="icon-btn" data-action="close-dialog" aria-label="Lukk dialog">${icon('close')}</button></div><div class="drawer-body" id="drawerBody">${body}</div>${footer?`<div class="drawer-footer">${footer}</div>`:''}</section></div>`;document.body.style.overflow='hidden';document.querySelector('.drawer').focus();document.getElementById('main').setAttribute('inert','');document.getElementById('sidebar').setAttribute('inert','');document.querySelector('.topbar').setAttribute('inert','');}
function closeDialog(){if(activeJob){activeJob.cancel();activeJob=null;}document.getElementById('dialogRoot').innerHTML='';document.body.style.overflow='';for(const el of [document.getElementById('main'),document.getElementById('sidebar'),document.querySelector('.topbar')])el.removeAttribute('inert');ui.dialog=null;ui.proposal=null;if(previousFocus?.isConnected)previousFocus.focus();else document.getElementById('main').focus({preventScroll:true});}
function formError(msg){const el=document.getElementById('formError');if(el){el.innerHTML=`<div class="error-box" role="alert">${esc(msg)}</div>`;el.scrollIntoView({block:'nearest'});}else toast(msg,true);}
function cancel(){return button('Avbryt','close-dialog','','');}
function employeeOptions(selected=''){return state.employees.map(e=>`<option value="${e.id}" ${selected===e.id?'selected':''}>${esc(e.name)} · ${esc(e.role)}</option>`).join('');}
function employeeDialog(id){const e=empById(state,id)||{name:'',role:'Miljøterapeut',percent:80,medication:false,experienced:false,response:false,allowed:['D','K'],preferred:'D'},editing=!!id;openDialog(editing?'En viktig del av laget':'En ny kollega',editing?'Oppdater fiktive medarbeiderdata. Eksisterende vakter blir kontrollert på nytt.':'Bruk et oppdiktet navn når du prøver demoen.',`<form id="employeeForm" data-id="${id||''}"><div class="form-grid"><div class="field span-2"><label for="empName">Navn</label><input id="empName" name="name" value="${esc(e.name)}" maxlength="70" placeholder="F.eks. Ida Eksempel" required autocomplete="off"></div><div class="field"><label for="empRole">Faggruppe</label><select name="role" id="empRole">${['Miljøterapeut','Sykepleier','Vernepleier','Barnevernspedagog','Helsefagarbeider','Assistent'].map(r=>`<option ${e.role===r?'selected':''}>${r}</option>`).join('')}</select></div><div class="field"><label for="empPercent">Stillingsprosent</label><input type="number" min="10" max="100" step="1" name="percent" id="empPercent" value="${e.percent}" required></div></div><div class="form-section">KOMPETANSE</div><label class="check-row"><input type="checkbox" name="medication" ${e.medication?'checked':''}><span>Har medisinkompetanse<small>Et kompetansekrav i denne eksempelavdelingen.</small></span></label><label class="check-row"><input type="checkbox" name="experienced" ${e.experienced?'checked':''}><span>Erfaren medarbeider<small>Kan være erfaren kollega på en vakt.</small></span></label><label class="check-row"><input type="checkbox" name="response" ${e.response?'checked':''}><span>Kan inngå i beredskapslaget<small>Har kompetanse for avdelingens håndtering av utagering. Tilrettelegging registreres separat for aktuelle datoer.</small></span></label><div class="form-section">VAKTTYPER</div>${Object.entries(SHIFTS).map(([k,v])=>`<label class="check-row"><input type="checkbox" name="allowed" value="${k}" ${e.allowed.includes(k)?'checked':''}><i class="legend-dot ${k}">${k}</i><span>${v.name}<small>${v.time}</small></span></label>`).join('')}<div class="field" style="margin-top:12px"><label for="empPreferred">Foretrukket vakttype</label><select id="empPreferred" name="preferred">${Object.entries(SHIFTS).map(([k,v])=>`<option value="${k}" ${e.preferred===k?'selected':''}>${v.name}</option>`).join('')}</select><small>Et ønske som teller ved generering.</small></div><div id="formError"></div>${editing?`<div class="form-section">I DENNE PLANEN</div><div class="stat-row"><span>Planlagte timer</span><strong>${num(hours(state,e.id),1)} t</strong></div><div class="stat-row"><span>Veiledende måltall</span><strong>${num(target(e),1)} t</strong></div><div style="margin-top:16px">${button('Registrer tilrettelegging','restriction-new','sliders','sm',`data-id="${e.id}"`)}</div><div style="margin-top:20px">${button('Fjern fra demoen','employee-remove','trash','danger sm',`data-id="${e.id}"`)}</div>`:''}</form>`,cancel()+`<button class="btn primary" type="submit" form="employeeForm">${icon('check')}Lagre medarbeider</button>`);}
function shiftDialog(id,d){const e=empById(state,id),a=absence(state,id,d),v=state.plan[key(id,d)];if(!e)return;openDialog(`${esc(e.name)}`,`${dayLabel(d)} ${dateLabel(d,true)} · uke ${43+Math.floor(d/7)}`,a?`<div class="note amber"><strong>${TYPES[a.type].label} er godkjent.</strong><br>Datoen er sperret. Fjern fraværsoppføringen fra detaljvisningen hvis den ikke lenger skal gjelde.</div><div style="margin-top:20px">${button('Se fraværet','request-detail','calendar','',`data-id="${a.id}"`)}</div>`:`<div class="person" style="margin-bottom:22px">${avatar(e)}<div><strong>${esc(e.role)} · ${e.percent} % stilling</strong><small>${e.medication?'Medisinkompetanse · ':''}${e.experienced?'Erfaren medarbeider':'Under opplæring'}</small></div></div><form id="shiftForm" data-id="${id}" data-day="${d}"><div class="field"><label for="shiftValue">Vakt denne dagen</label><select id="shiftValue" name="shift"><option value="">Fri / ingen vakt</option>${Object.entries(SHIFTS).map(([k,s])=>`<option value="${k}" ${v?.shift===k?'selected':''}>${s.name} · ${s.time}</option>`).join('')}</select><small>Alle vakttyper vises. Tildelingen kontrolleres før den lagres.</small></div><label class="check-row" style="margin-top:15px"><input type="checkbox" name="locked" ${v?.locked?'checked':''}><span>Lås denne vakten<small>Beholdes når du lager et nytt turnusforslag.</small></span></label><div id="shiftCheck"></div><div id="formError"></div><div class="form-section">DENNE UKEN</div><div class="stat-row"><span>Planlagte timer nå</span><strong>${num(hours(state,id,Math.floor(d/7)*7,Math.floor(d/7)*7+7),1)} t</strong></div><div class="note" style="margin-top:18px">Manuelle endringer kan lage hull i bemanningen eller kompetansedekningen. Disse vises i oversikten. Endringer skjer bare i din demoplan.</div>${v?`<div style="margin-top:18px">${button('Registrer fravær denne dagen','request-new','heart','sm',`data-id="${id}" data-day="${d}"`)}</div>`:''}</form>`,a?button('Lukk','close-dialog'):cancel()+`<button class="btn primary" type="submit" form="shiftForm">${icon('check')}Lagre endring</button>`);if(!a)updateShiftCheck();}
function updateShiftCheck(){const form=document.getElementById('shiftForm');if(!form)return;const k=document.getElementById('shiftValue').value,e=empById(state,form.dataset.id),d=Number(form.dataset.day),rr=k?reasons(state,e,d,k,true):[];document.getElementById('shiftCheck').innerHTML=rr.length?`<div class="error-box">${rr.map(esc).join('<br>')}</div>`:`<div class="success-box">${k?'Ingen hindringer funnet i demoens tildelingskontroll.':'Vakten fjernes. Bemanningsbehovet blir stående.'}</div>`;}
function requestDialog(id,day){const emp=id||state.employees[0].id,d=Number.isInteger(day)?day:TODAY;openDialog('Fravær eller ønske om fri','Registrer en fiktiv oppføring i perioden 19. oktober – 29. november.',`<form id="requestForm"><div class="form-grid"><div class="field span-2"><label for="requestEmployee">Medarbeider</label><select id="requestEmployee" name="employee">${employeeOptions(emp)}</select></div><div class="field span-2"><label for="requestType">Hva gjelder det?</label><select id="requestType" name="type">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}" ${(id?'syk':'fri')===k?'selected':''}>${v.label}</option>`).join('')}</select></div><div class="field"><label for="requestStart">Fra og med</label><input id="requestStart" name="start" type="date" min="${START}" max="${isoAt(41)}" value="${isoAt(d)}" required></div><div class="field"><label for="requestEnd">Til og med</label><input id="requestEnd" name="end" type="date" min="${START}" max="${isoAt(41)}" value="${isoAt(d)}" required></div><div class="field span-2"><label for="requestStatus">Behandling</label><select id="requestStatus" name="status"><option value="pending" ${!id?'selected':''}>Til vurdering</option><option value="approved" ${id?'selected':''}>Godkjent / bekreftet fravær</option></select></div></div><div class="note" style="margin-top:20px"><strong>Godkjent fravær fjerner eventuelle vakter.</strong> De berørte vaktene vises som bemanningsbehov, også hvis de var låst. Registrer ingen diagnoser eller opplysninger om ekte personer.</div><div id="formError"></div></form>`,cancel()+`<button class="btn primary" type="submit" form="requestForm">${icon('plus')}Registrer</button>`);}
function requestDetail(id){const r=state.requests.find(x=>x.id===id);if(!r)return;const e=empById(state,r.employee),assignments=Array.from({length:r.end-r.start+1},(_,i)=>i+r.start).filter(d=>get(state,e.id,d));openDialog(TYPES[r.type].label,`${esc(e.name)} · ${dateLabel(r.start)}${r.end!==r.start?' – '+dateLabel(r.end):''}`,`<div class="person" style="margin-bottom:20px">${avatar(e)}<div><strong>${esc(e.name)}</strong><small>${esc(e.role)} · ${e.percent} %</small></div></div><div class="stat-row"><span>Status</span>${requestStatus(r)}</div><div class="stat-row"><span>Periode</span><strong>${dateLabel(r.start)} – ${dateLabel(r.end)}</strong></div><div class="stat-row"><span>Berørte datoer</span><strong>${r.end-r.start+1}</strong></div>${r.status==='pending'?`<div class="note ${assignments.length?'amber':''}" style="margin-top:20px">${assignments.length?`<strong>${assignments.length} planlagte vakter vil bli fjernet ved godkjenning.</strong> Finn erstattere fra turnusoversikten etterpå.`:'Ingen vakter er tildelt på de ønskede datoene. Ønsket kan godkjennes uten å flytte eksisterende vakter.'}</div>`:`<div class="note" style="margin-top:20px">${r.status==='approved'?'Fraværet sperrer datoene i denne demoplanen.':'Oppføringen inngår ikke som et ønske i nye turnusforslag.'}</div>`}<div style="margin-top:25px">${button('Fjern oppføring','request-remove','trash','danger sm',`data-id="${id}"`)}</div>`,r.status==='pending'?button('Avslå ønske','request-reject','','',`data-id="${id}"`)+button('Godkjenn','request-approve','check','primary',`data-id="${id}"`):button('Lukk','close-dialog'));
}
function skillBadges(s,team,d,k){return `<div class="skill-summary">${skillStatus(s,team,d,k).filter(x=>x.need>0).map(x=>badge(`${x.label} ${x.have}/${x.need}`,x.have<x.need?'warn':'blue')).join('')}</div>`;}
function dayDialog(d){openDialog(`${dayLabel(d)[0].toUpperCase()+dayLabel(d).slice(1)} ${dateLabel(d)}`,`Dagens bemanning · uke ${43+Math.floor(d/7)}`,Object.entries(SHIFTS).map(([k,v])=>{const team=assigned(state,d,k),need=needed(state,d,k);return `<div class="day-team"><div class="day-team-head"><strong><i class="legend-dot ${k}">${k}</i> ${v.name}</strong>${badge(team.length+' / '+need,team.length<need?'warn':'')}</div><p class="small muted" style="margin-bottom:12px">${v.time}</p>${skillBadges(state,team,d,k)}${team.map(e=>`<div class="insight-item" style="padding:9px 0">${avatar(e)}<div><strong>${esc(e.name)}</strong><p>${esc(e.role)}${skillAvailable(state,e,d,k,'medication')?' · Medisin':''}${e.response&&!skillAvailable(state,e,d,k,'response')?' · Tilrettelagt':''}</p></div><button class="icon-btn" data-action="shift" data-id="${e.id}" data-day="${d}" aria-label="Rediger vakt for ${esc(e.name)}" style="margin-left:auto">${icon('edit')}</button></div>`).join('')}${team.length<need||!requiredSkills(state,team,d,k)?`<div style="margin-top:12px">${button('Finn en kandidat','repair','spark','sm',`data-day="${d}" data-shift="${k}"`)}</div>`:''}</div>`;}).join(''),button('Lukk','close-dialog'));}
function repairDialog(d,k){const team=assigned(state,d,k),need=needed(state,d,k),candidates=repairOptions(state,d,k);const full=team.length>=need;openDialog('Finn en god erstatter',`${SHIFTS[k].name} · ${dayLabel(d)} ${dateLabel(d)} · ${SHIFTS[k].time}`,`<div class="note ${full?'amber':''}"><strong>${team.length} av ${need} plasser er fylt.</strong> ${full?'Vakten er fullt bemannet. Endre sammensetningen via en eksisterende vakt for å løse kompetansemangelen.':'Kandidatene har ingen registrert vakt eller godkjent fravær denne datoen, og passer demoens tildelingsregler.'}</div>${skillBadges(state,team,d,k)}<div class="form-section">${full?'KOMPETANSE MÅ VURDERES':'AKTUELLE KANDIDATER'}</div>${!full&&candidates.length?candidates.slice(0,8).map((c,i)=>`<div class="candidate"><div class="candidate-top">${avatar(c.employee)}<div><strong style="font-size:12px">${esc(c.employee.name)}</strong><small class="muted" style="display:block;font-size:10px">${esc(c.employee.role)} · ${c.employee.percent} %</small></div>${i===0?badge('Første forslag'):''}</div><div class="candidate-meta"><span>${icon('clock')}${num(c.weekHours,1)} t denne uken</span><span>${icon('shield')}${skillAvailable(state,c.employee,d,k,'medication')?'Medisinkompetanse':'Erfaring: '+(c.employee.experienced?'ja':'opplæring')}</span></div><p class="small muted" style="font-size:10px;margin-bottom:12px">${wish(state,c.employee.id,d)?'Har ønsket fri denne dagen. Avklar ønsket før du velger.':'Ingen friønsker registrert denne dagen.'} Én ny tildeling, øvrige vakter beholdes.</p>${skillBadges(state,[...team,c.employee],d,k)}${button('Velg til demoplanen','select-candidate','plus',i===0?'primary':'',`data-id="${c.employee.id}" data-day="${d}" data-shift="${k}"`)}</div>`).join(''):empty(full?'Endre lagets sammensetning':'Ingen direkte erstatter funnet',full?'Klikk på en eksisterende vakt i dagsvisningen.':'Prøv å justere andre vakter, legge til en fiktiv vikar eller lage et nytt forslag.','people')}<div class="note amber" style="margin-top:15px">Et forslag bekrefter ikke at medarbeideren kan eller vil jobbe. I en faktisk løsning må tilgjengelighet, samtykke ved behov og komplett arbeidstidshistorikk avklares.</div>`,button('Se hele dagen','day','calendar','',`data-day="${d}"`)+button('Lukk','close-dialog'));}
function generationDialog(){openDialog('La oss få kabalen til å gå opp.','Velg hva forslaget skal prioritere. Du vurderer endringene før de tas i bruk.',`<form id="generateForm"><div class="form-section">HVA ER VIKTIGST DENNE GANGEN?</div>${[['balanced','En balansert plan','Fordel timer, helger og ønsker så godt som mulig.'],['wishes','Gi ønskene mer plass','Gi uoppfylte friønsker større vekt i beregningen.']].map(([v,t,desc],i)=>`<label class="option-card"><input type="radio" name="strategy" value="${v}" ${i===0?'checked':''}><span><strong>${t}</strong><small>${desc}</small></span></label>`).join('')}<div class="form-section">BEVAR DET SOM FUNGERER</div><label class="check-row"><input type="checkbox" name="keep" checked><span>Fyll bare ledige plasser<small>Alle eksisterende vakter blir stående. Fjern avkryssingen for å bygge planen på nytt.</small></span></label><div class="note" style="margin-top:14px"><strong>Låste vakter beholdes alltid.</strong> Godkjent fravær sperrer datoer. Uløste bemanningsbehov vises tydelig i resultatet.</div><p class="notice-inline" style="margin-top:20px">Demoen bruker en enkel lokal søkealgoritme. Den beviser verken at et forslag er optimalt, eller at en uløst vakt ikke kan løses på en annen måte.</p></form>`,cancel()+`<button class="btn primary" type="submit" form="generateForm">${icon('spark')}Beregn forslag</button>`);}
function proposalDialog(proposal){const before=metrics(state),after=metrics(proposal),changes=[];for(const e of state.employees)for(let d=0;d<DAYS;d++){const a=get(state,e.id,d),b=get(proposal,e.id,d);if(a!==b)changes.push({employee:e,day:d,from:a,to:b});}ui.proposal=proposal;openDialog('Et nytt utgangspunkt.','Se hva som endres før du tar forslaget inn i demoplanen.',`<div class="metrics">${metric('Bemanningsdekning',num(after.coverage,1),'%',`Fra ${num(before.coverage,1)} %`,'people','emphasis')}${metric('Endrede ruter',changes.length,'','Låste vakter er beholdt','calendar')}${metric('Ønsker oppfylt',after.wishesMet,`av ${after.wishes}`,`Fra ${before.wishesMet} oppfylte ønsker`,'heart')}${metric('Avvik i demokontroll',after.issues.length,'',after.issues.length?'Må vurderes før gjennomgang':'Ingen avvik i de kontrollerte reglene','shield')}</div><div class="note ${after.gaps.length||after.issues.length?'amber':''}"><strong>${after.gaps.length?`${after.gaps.length} vakter trenger fortsatt oppfølging.`:'Bemanningsbehovene og kompetansekravene er dekket.'}</strong> ${after.gaps.length?'Algoritmen fant ikke en komplett løsning. Dette beviser ikke at det er umulig.':'Planen må fortsatt vurderes av den som kjenner avdelingen.'}</div><div class="note" style="margin-top:12px">Sammensetningsønsker: ${pairPenalty(proposal)} felles vakter utover ønskede grenser, mot ${pairPenalty(state)} i arbeidsutkastet. Dette er myke hensyn.</div><div class="form-section">${changes.length} ENDRINGER I FORSLAGET</div><div class="proposal-diff">${changes.slice(0,100).map(c=>`<div class="diff-row"><div><strong style="font-weight:500">${esc(c.employee.name)}</strong><small>${dayLabel(c.day)} ${dateLabel(c.day)}</small></div><div class="diff-chips"><span class="shift ${c.from||'free'}">${c.from||'–'}</span>${icon('arrow')}<span class="shift ${c.to||'free'}">${c.to||'–'}</span></div></div>`).join('')||'<p class="empty-small">Ingen ruter endres med disse innstillingene.</p>'}${changes.length>100?`<p class="notice-inline">Viser de første 100 av ${changes.length} endringer.</p>`:''}</div>`,cancel()+button('Bruk som nytt utkast','apply-proposal','check','primary'),true);ui.proposal=proposal;}
function validationDialog(review=false){const m=metrics(state),issueList=m.issues.map(x=>({title:empById(state,x.employee)?.name||'Medarbeider',text:x.text})),gapList=m.gaps.map(g=>({title:`${SHIFTS[g.shift].name} · ${dateLabel(g.day)}`,text:[g.lack?`${g.lack} ubesatte plasser`:'',...g.skills.map(x=>`${x.label}: ${x.have} av ${x.need}`)].filter(Boolean).join(' · ')}));openDialog(review?'Gjennomgå utkastet':'Kontroll av demoplanen','Kontrollen omfatter bare reglene som er implementert i denne prototypen.',`<div class="metrics">${metric('Tildelingsavvik',m.issues.length,'','Hvile, arbeidstimer og sperrer','shield')}${metric('Vakter til oppfølging',m.gaps.length,'','Bemanning og kompetanse','people')}</div>${issueList.length||gapList.length?`<ul class="issues">${[...issueList,...gapList].slice(0,100).map(x=>`<li>${icon('alert')}<div><strong>${esc(x.title)}</strong><small>${esc(x.text)}</small></div></li>`).join('')}</ul>`:`<div class="success-box">Ingen avvik er funnet i eksempelreglene eller bemanningsbehovet.</div>`}<div class="note amber" style="margin-top:20px"><strong>Dette er ikke en juridisk godkjenning.</strong> Full tariffkontroll, sammenhengende ukentlig hvile, faktisk overtid, arbeid før og etter perioden og faglig forsvarlighet er ikke dokumentert av demoen.</div>${review?`<label class="check-row" style="margin-top:15px"><input id="reviewConfirm" type="checkbox"><span>Jeg har sett over dette demoutkastet<small>Markeringen lagres lokalt. Ingen plan publiseres eller sendes til medarbeidere.</small></span></label>`:''}<div id="formError"></div>`,button('Lukk','close-dialog')+(review?button('Marker gjennomgått','confirm-review','checkcircle','primary',m.issues.length||m.gaps.length?'disabled':''):''),true);}
function baselineDialog(){const changes=planChanges(state);openDialog('Grunnturnus og hverdagens endringer','Den lagrede grunnturnusen er et sammenligningspunkt for disse seks ukene.',`<div class="note"><strong>${changes.length} ruter er endret fra grunnturnusen.</strong> Ferie, kurs, fravær og manuelle endringer påvirker arbeidsutkastet. Grunnturnusen beholdes til du selv erstatter den.</div><div class="form-section">ENDRINGER I ARBEIDSUTKASTET</div><div class="proposal-diff">${changes.slice(0,100).map(c=>`<div class="diff-row"><div><strong>${esc(c.employee.name)}</strong><small>${dateLabel(c.day)}</small></div><div class="diff-chips"><span class="shift ${c.from||'free'}">${c.from||'–'}</span>${icon('arrow')}<span class="shift ${c.to||'free'}">${c.to||'–'}</span></div></div>`).join('')||'<p class="empty-small">Planen følger den lagrede grunnturnusen.</p>'}${changes.length>100?`<p class="notice-inline">Viser de første 100 av ${changes.length} endringer.</p>`:''}</div><div class="note" style="margin-top:20px">En sommer-, jule- eller påsketurnus bør bygge på en grunnturnus med egne datoer og behov. Demoen viser sammenligningen innenfor den faste seksukersperioden; separate sesongplaner gjenstår.</div>`,button('Lukk','close-dialog')+button('Lagre utkast som grunnturnus','save-baseline','copy','primary'),true);}
function periodDialog(){openDialog('Seks uker. Ett lag.','Velg hvilken uke du vil se i turnusoversikten.',Array.from({length:6},(_,w)=>{let need=0,have=0;for(let d=w*7;d<w*7+7;d++)for(const k of Object.keys(SHIFTS)){need+=needed(state,d,k);have+=Math.min(count(state,d,k),needed(state,d,k));}return `<div class="candidate"><div class="candidate-top"><span class="icon-box">${icon('calendar')}</span><div><strong>Uke ${43+w}</strong><small style="display:block" class="muted">${dateLabel(w*7)} – ${dateLabel(w*7+6)}</small></div>${badge(have+' / '+need,have<need?'warn':'')}</div><div style="margin-top:12px">${button('Åpne uke '+(43+w),'jump-week','arrow','sm',`data-week="${w}"`)}</div></div>`;}).join(''),button('Lukk','close-dialog'));}
function pairDialog(){openDialog('Sammensetning av laget','Legg inn et konkret hensyn mellom to fiktive medarbeidere.',`<form id="pairForm"><div class="field"><label for="pairA">Medarbeider</label><select id="pairA" name="a">${employeeOptions()}</select></div><div class="field" style="margin-top:16px"><label for="pairB">Kollega</label><select id="pairB" name="b">${employeeOptions(state.employees[1]?.id)}</select></div><div class="field" style="margin-top:16px"><label for="pairMode">Hensyn</label><select id="pairMode" name="mode"><option value="limit">Begrens antall vakter sammen (ønske)</option><option value="prefer">Prioriter sammen på samme vakt (ønske)</option><option value="avoid">Sperr kombinasjonen (absolutt krav)</option></select><small>Begrensning og prioritering påvirker forslagene, men blokkerer ikke vakter.</small></div><div class="field" id="pairLimitField" style="margin-top:16px"><label for="pairLimit">Ønsket maks antall felles vakter i seks uker</label><input type="number" id="pairLimit" name="limit" min="0" max="42" step="1" value="2"><small>Gjelder når «Begrens» er valgt. Eventuelle overskridelser vises i regeloversikten.</small></div><div class="note" style="margin-top:20px">I et faktisk produkt må slike kriterier være nødvendige, saklig begrunnet og behandles med riktig tilgangsstyring.</div><div id="formError"></div></form>`,cancel()+`<button class="btn primary" type="submit" form="pairForm">${icon('plus')}Legg til hensyn</button>`);}
function exportDialog(){openDialog('Ta planen videre.','Eksporter det du har jobbet med i denne nettleseren.',`<div class="candidate"><div class="candidate-top"><span class="icon-box">${icon('file')}</span><div><strong>Turnus til Excel</strong><small class="muted" style="display:block">CSV · alle medarbeidere · seks uker</small></div></div><p class="notice-inline" style="margin:13px 0">Åpnes i Excel og andre regneark. Dette er ikke en Gat-import.</p>${button('Last ned turnus.csv','download-csv','download','primary')}</div><div class="candidate"><div class="candidate-top"><span class="icon-box">${icon('download')}</span><div><strong>Hele demoprosjektet</strong><small class="muted" style="display:block">JSON · plan, medarbeidere, regler og innspill</small></div></div><p class="notice-inline" style="margin:13px 0">Ta vare på utprøvingen, eller åpne den i en annen nettleser.</p>${button('Last ned sikkerhetskopi','download-json','download')}</div><div class="candidate"><div class="candidate-top"><span class="icon-box">${icon('print')}</span><div><strong>Skriv ut / lagre PDF</strong><small class="muted" style="display:block">Uken eller ukene som vises i turnusen</small></div></div><div style="margin-top:15px">${button('Åpne utskriftsvisning','print','print')}</div></div><div class="form-section">ÅPNE EN TIDLIGERE UTPRØVING</div><label class="btn import-label">${icon('upload')}Importer VaktLaget-JSON<input type="file" id="importFile" accept=".json,application/json" class="sr-only"></label><p class="notice-inline">Import erstatter demoen i denne nettleseren etter bekreftelse.</p>`,button('Lukk','close-dialog'));}
function helpDialog(){openDialog('Velkommen til VaktLaget.','Et første, interaktivt produktutkast for Jo Bendik og Erik.',`<div class="note"><strong>Prøv det som om det var deres avdeling.</strong> Endre vakter, juster bemanning og se hva som skjer. Alle navn og opplysninger er oppdiktet.</div><div class="form-section">DETTE FUNGERER I DEMOEN</div><ul class="help-list"><li>En redigerbar seksukersplan med lagret grunnturnus og oversikt over endringer.</li><li>Registrering og behandling av fravær og friønsker, samt tidsavgrenset tilrettelegging.</li><li>Turnusforslag og kandidatforslag ved fravær. Antall personer med medisin-, erfarings- og beredskapskompetanse telles per vakt.</li><li>Kontroll av overlapp/hvile mellom vakter, makstimer i sju kalenderdager, arbeidsdager på rad, tillatte vakttyper og sperrede kombinasjoner.</li><li>Myke grenser for antall felles vakter, låsing, manuell gjennomgang, lokal lagring og eksport. Mørkt eller lyst tema huskes i nettleseren.</li></ul><div class="form-section">DETTE GJENSTÅR FØR FAKTISK BRUK</div><ul class="help-list"><li><strong>Et verifisert regelverk.</strong> Full norsk lov- og tariffmodell, ukentlig hvile, medleverordninger, ferie-/timeberegning og historikk utenfor planperioden.</li><li><strong>En produksjonsklar beregningsmotor.</strong> Demoen bruker en enkel søkealgoritme, ikke en fullverdig optimeringsløser. Den kan overse mulige løsninger.</li><li><strong>Sesongplaner og godkjenningsflyt.</strong> Egne sommer-, jule- og påskeperioder og separat gjennomgang av leder og tillitsvalgt gjenstår.</li><li><strong>Innlogging og delt arbeidsrom.</strong> Det finnes ingen kontoer, serverlagring, tilgangsstyring eller samarbeid på tvers av nettlesere.</li><li><strong>Integrasjoner og drift.</strong> Ingen Gat-tilkobling, lønnseksport, varsling eller faktisk publisering av arbeidsplaner.</li></ul><div class="note amber">En grønn demokontroll betyr bare at de implementerte eksempelreglene er oppfylt. Den er ikke en garanti for lovlighet eller faglig forsvarlighet. Legg ikke inn ekte personal- eller pasientopplysninger.</div><div class="form-section">FORTSETT UTFORSKINGEN</div><div class="actions">${button('Gi innspill','feedback','message','sm')}${button('Eksporter / importer','export','download','sm')}<a class="btn sm" href="https://github.com/jobendik/VaktLaget" target="_blank" rel="noopener noreferrer">${icon('link')}GitHub-repo</a></div><div style="margin-top:22px">${button('Tilbakestill eksempeldata','reset','refresh','danger sm')}</div>`,button('Tilbake til appen','close-dialog','','primary'),true);}
function feedbackDialog(){openDialog('Hva ville gjort dette nyttig?','Samle konkrete innspill mens du prøver VaktLaget.',`<div class="note"><strong>Start gjerne med en situasjon fra hverdagen.</strong> Hva ville du gjort annerledes? Hvilken regel mangler? Hvor stopper arbeidsflyten opp?</div><form id="feedbackForm" style="margin-top:20px"><div class="field"><label for="feedbackText">Dine innspill</label><textarea id="feedbackText" name="notes" maxlength="10000" style="min-height:240px" placeholder="Eksempel: Når noen blir syke på nattevakt, må jeg også kunne …">${esc(state.notes)}</textarea></div><p class="feedback-saved" id="feedbackStatus">Lagres i denne nettleseren når du trykker Lagre.</p></form><div class="note" style="margin-top:18px">Innspill sendes ikke automatisk. Last dem ned for å dele dem med Jo Bendik. Unngå navn på ekte ansatte eller pasienter.</div>`,button('Last ned innspill','download-notes','download')+`<button class="btn primary" type="submit" form="feedbackForm">${icon('check')}Lagre innspill</button>`);}
function download(content,name,type){const url=URL.createObjectURL(new Blob([content],{type}));const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function readRules(){const old=clone(state.rules);old.rest=Number(document.getElementById('ruleRest').value);old.maxHours=Number(document.getElementById('ruleHours').value);old.maxDays=Number(document.getElementById('ruleDays').value);for(const k of Object.keys(SHIFTS))for(const skill of Object.keys(SKILLS))old.skills[k][skill]=Number(document.getElementById(`skill-${k}-${skill}`).value);for(const t of ['weekday','weekend'])for(const k of Object.keys(SHIFTS))old.needs[t][k]=Number(document.getElementById(`need-${t}-${k}`).value);return old;}
function rulesDirty(){return JSON.stringify(readRules())!==JSON.stringify(state.rules);}
function runGenerator(snapshot,strategy,keep,seed){return new Promise((resolve,reject)=>{
 let worker=null,url=null,finished=false;
 const finish=(error,value)=>{if(finished)return;finished=true;if(worker)worker.terminate();if(url)URL.revokeObjectURL(url);activeJob=null;error?reject(error):resolve(value);};
 activeJob={cancel:()=>finish(null,null)};
 if(typeof Worker!=='undefined'){
  try{const source=document.getElementById('app-script').textContent+'\nself.onmessage=function(e){try{self.postMessage({ok:true,value:VaktLaget.generate(e.data.snapshot,e.data.strategy,e.data.keep,e.data.seed)});}catch(error){self.postMessage({ok:false,error:error.message});}};';url=URL.createObjectURL(new Blob([source],{type:'text/javascript'}));worker=new Worker(url);worker.onmessage=e=>e.data.ok?finish(null,e.data.value):finish(Error(e.data.error));worker.onerror=()=>finish(Error('Beregningen kunne ikke fullføres.'));worker.postMessage({snapshot,strategy,keep,seed});return;}catch(error){if(worker)worker.terminate();if(url)URL.revokeObjectURL(url);worker=null;url=null;}
 }
 setTimeout(()=>{if(finished)return;try{finish(null,generate(snapshot,strategy,keep,seed))}catch(error){finish(error)}},80);
});}
async function handleAction(action,el){const id=el.dataset.id,d=Number(el.dataset.day),k=el.dataset.shift;
 switch(action){
 case 'toggle-theme':toggleTheme();break;
 case 'nav':navigate(el.dataset.page);break;
 case 'menu':document.getElementById('sidebar').classList.add('open');document.getElementById('mobileBackdrop').classList.add('open');break;
 case 'close-menu':closeMenu();break;
 case 'close-dialog':closeDialog();break;
 case 'help':helpDialog();break;
 case 'feedback':feedbackDialog();break;
 case 'employee':employeeDialog(id);break;
 case 'shift':shiftDialog(id,d);break;
 case 'day':dayDialog(d);break;
 case 'repair':repairDialog(d,k);break;
 case 'prev-week':ui.week=Math.max(0,ui.week-1);render();break;
 case 'next-week':ui.week=Math.min(6-ui.span/7,ui.week+1);render();break;
 case 'span':ui.span=Number(el.dataset.span)===14?14:7;ui.week=Math.min(ui.week,6-ui.span/7);render();break;
 case 'baseline':baselineDialog();break;
 case 'save-baseline':if(confirm('Erstatte den lagrede grunnturnusen med arbeidsutkastet? Sammenligningen starter på nytt; vakter, fravær og regler beholdes.')){state.basePlan=clone(state.plan);log('Arbeidsutkastet er lagret som ny grunnturnus for sammenligning.');save();closeDialog();render();toast('Grunnturnusen er lagret.');}break;
 case 'period':periodDialog();break;
 case 'jump-week':ui.week=Number(el.dataset.week);ui.span=7;closeDialog();navigate('plan');break;
 case 'restriction-new':restrictionDialog(id);break;
 case 'restriction-remove':if(confirm('Fjerne denne tilretteleggingen? Medarbeiderens registrerte kompetanse vil telle igjen på de berørte vaktene.')){state.restrictions=state.restrictions.filter(r=>r.id!==id);persist('En tilrettelegging er fjernet.');toast('Kompetansedekningen er beregnet på nytt.');}break;
 case 'request-new':requestDialog(id,el.dataset.day!==undefined?d:undefined);break;
 case 'request-detail':requestDetail(id);break;
 case 'request-filter':ui.requestFilter=el.dataset.filter;render();break;
 case 'request-approve':{let n;try{n=approveRequest(state,id)}catch(error){toast(error.message,true);break;}closeDialog();persist(`Fravær er godkjent. ${n} vakter ble frigjort.`);toast(n?`Godkjent. ${n} vakter trenger nå ny bemanning.`:'Ønsket er godkjent.');break;}
 case 'request-reject':{const r=state.requests.find(x=>x.id===id);if(r)r.status='rejected';closeDialog();persist('Et friønske er avslått i demoen.');toast('Ønsket er markert som avslått.');break;}
 case 'request-remove':if(confirm('Fjerne denne oppføringen? Eventuelle tidligere vakter blir ikke lagt tilbake automatisk.')){state.requests=state.requests.filter(r=>r.id!==id);closeDialog();persist('En fraværsoppføring er fjernet.');toast('Oppføringen er fjernet.');}break;
 case 'employee-remove':{if(state.employees.length===1){toast('Behold minst én medarbeider i demoen.',true);break;}const e=empById(state,id);if(confirm(`Fjerne ${e.name} og alle tilhørende vakter, ønsker og sammensetningshensyn fra demoen?`)){state.employees=state.employees.filter(e=>e.id!==id);state.plan=Object.fromEntries(Object.entries(state.plan).filter(([k])=>!k.startsWith(id+':')));state.requests=state.requests.filter(r=>r.employee!==id);state.restrictions=state.restrictions.filter(r=>r.employee!==id);state.basePlan=Object.fromEntries(Object.entries(state.basePlan).filter(([k])=>!k.startsWith(id+':')));state.pairs=state.pairs.filter(p=>p.a!==id&&p.b!==id);closeDialog();persist(`${e.name} er fjernet fra demoplanen.`);toast('Medarbeideren er fjernet. Se over bemanningen.');}break;}
 case 'select-candidate':{const r=applyShift(state,id,d,k);if(!r.ok){toast(r.errors.join(' '),true);break;}const e=empById(state,id);closeDialog();persist(`${e.name} er satt på ${SHIFTS[k].short.toLowerCase()} ${dateLabel(d)}.`);toast('Kandidaten er lagt inn i demoplanen.');break;}
 case 'generate':generationDialog();break;
 case 'apply-proposal':{if(!ui.proposal)break;state.plan=clone(ui.proposal.plan);closeDialog();persist('Et nytt turnusforslag er tatt i bruk som utkast.');toast('Forslaget er lagt inn. Du kan fortsette å justere.');break;}
 case 'validation':validationDialog();break;
 case 'review':validationDialog(true);break;
 case 'confirm-review':{if(!document.getElementById('reviewConfirm')?.checked){formError('Kryss av for at du har sett over demoutkastet.');break;}const m=metrics(state);if(m.issues.length||m.gaps.length){formError('Rett opp registrerte avvik og bemanningsbehov først.');break;}state.reviewed=true;log('Demoutkastet er markert som gjennomgått.');save();closeDialog();render();toast('Gjennomgangen er registrert lokalt.');break;}
 case 'save-rules':{const s=clone(state);s.rules=readRules();try{validateData(s)}catch(e){toast(e.message,true);break;}state.rules=s.rules;persist('Eksempelreglene og bemanningsbehovet er oppdatert.');toast('Reglene er lagret. Eksisterende vakter er kontrollert på nytt.');break;}
 case 'pair-new':if(ui.page==='rules'&&rulesDirty()){toast('Lagre regelendringene før du legger til et hensyn.',true);break;}pairDialog();break;
 case 'pair-remove':if(ui.page==='rules'&&rulesDirty()){toast('Lagre regelendringene først.',true);break;}state.pairs=state.pairs.filter(p=>p.id!==id);persist('Et sammensetningshensyn er fjernet.');toast('Hensynet er fjernet.');break;
 case 'export':exportDialog();break;
 case 'download-csv':download(csv(state),'VaktLaget-turnus-demo.csv','text/csv;charset=utf-8');toast('CSV-filen er klargjort.');break;
 case 'download-json':download(JSON.stringify(state,null,2),'VaktLaget-demoprosjekt.json','application/json');toast('Sikkerhetskopien er klargjort.');break;
 case 'print':closeDialog();if(ui.page!=='plan')navigate('plan');setTimeout(()=>window.print(),100);break;
 case 'download-notes':{state.notes=document.getElementById('feedbackText')?.value??state.notes;save();download('VaktLaget – innspill til førsteutkast\n\n'+state.notes,'VaktLaget-innspill.txt','text/plain;charset=utf-8');toast('Innspillene er lagret og klargjort for nedlasting.');break;}
 case 'reset':if(confirm('Tilbakestille alle lokale demoendringer, inkludert innspill? Eksporter først hvis du vil ta vare på dem.')){state=freshState();ui.week=0;ui.span=7;ui.search='';ui.role='all';closeDialog();save();navigate('plan');toast('Du er tilbake til de opprinnelige eksempeldataene.');}break;
 }
}
async function handleSubmit(event){const form=event.target;if(!['employeeForm','shiftForm','requestForm','generateForm','pairForm','restrictionForm','feedbackForm'].includes(form.id))return;event.preventDefault();const fd=new FormData(form);
 if(form.id==='employeeForm'){const name=String(fd.get('name')||'').trim(),allowed=fd.getAll('allowed'),preferred=fd.get('preferred'),percent=Number(fd.get('percent')),id=form.dataset.id;if(!name||name.length>70){formError('Skriv et navn på mellom 1 og 70 tegn.');return;}if(!allowed.length||!allowed.includes(preferred)){formError('Velg minst én vakttype. Foretrukket vakt må også være tillatt.');return;}if(!Number.isFinite(percent)||percent<10||percent>100){formError('Stillingsprosent må være mellom 10 og 100.');return;}if(!id&&state.employees.length>=80){formError('Demoen støtter inntil 80 medarbeidere.');return;}const e={id:id||uid('e'),name,role:String(fd.get('role')),percent,medication:fd.has('medication'),experienced:fd.has('experienced'),response:fd.has('response'),allowed,preferred,color:id?empById(state,id).color:state.employees.length%6};if(id)state.employees=state.employees.map(x=>x.id===id?e:x);else state.employees.push(e);closeDialog();persist(`${name} er ${id?'oppdatert':'lagt til i laget'}.`);toast('Medarbeideren er lagret.');}
 else if(form.id==='shiftForm'){const id=form.dataset.id,d=Number(form.dataset.day),r=applyShift(state,id,d,String(fd.get('shift')),fd.has('locked'));if(!r.ok){formError(r.errors.join(' '));return;}closeDialog();persist(`Vakten til ${empById(state,id).name} ${dateLabel(d)} er endret.`);toast('Endringen er lagret.');}
 else if(form.id==='requestForm'){const start=dayIndex(String(fd.get('start'))),end=dayIndex(String(fd.get('end')));if(!Number.isInteger(start)||!Number.isInteger(end)||start<0||end>=DAYS||end<start){formError('Velg gyldige datoer mellom 19. oktober og 29. november. Sluttdato må være etter eller lik startdato.');return;}const r={id:uid('r'),employee:String(fd.get('employee')),type:String(fd.get('type')),status:String(fd.get('status')),start,end};if(r.status==='approved'&&state.requests.some(x=>x.employee===r.employee&&x.status==='approved'&&x.start<=end&&x.end>=start)){formError('Datoene overlapper et allerede godkjent fravær. Endre eller fjern den oppføringen først.');return;}state.requests.unshift(r);const removed=r.status==='approved'?approveRequest(state,r.id):0;closeDialog();persist(`${TYPES[r.type].label} er registrert for ${empById(state,r.employee).name}.`);toast(removed?`Registrert. ${removed} vakter trenger nå erstatter.`:'Oppføringen er registrert.');}
 else if(form.id==='generateForm'){const strategy=String(fd.get('strategy')),keep=fd.has('keep'),snapshot=clone(state);openDialog('Vi setter sammen et forslag.','Alle låste vakter og godkjente fravær blir beholdt.',`<div class="loading"><span class="spinner" aria-hidden="true"></span><span role="status">Beregner en fordeling av vaktene …</span></div>`);try{const proposal=await runGenerator(snapshot,strategy,keep,state.revision*47);if(proposal&&ui.dialog)proposalDialog(proposal)}catch(e){closeDialog();toast('Forslaget kunne ikke beregnes. Prøv færre endringer eller tilbakestill demoen.',true);console.error(e);}}
 else if(form.id==='pairForm'){const a=String(fd.get('a')),b=String(fd.get('b')),mode=String(fd.get('mode'));if(a===b){formError('Velg to forskjellige medarbeidere.');return;}if(state.pairs.some(p=>(p.a===a&&p.b===b)||(p.a===b&&p.b===a))){formError('Det finnes allerede et hensyn for disse to. Fjern det først hvis det skal endres.');return;}const limit=Number(fd.get('limit'));if(mode==='limit'&&(!Number.isInteger(limit)||limit<0||limit>DAYS)){formError('Velg et helt antall mellom 0 og 42.');return;}state.pairs.push({id:uid('p'),a,b,mode,...(mode==='limit'?{limit}:{})});closeDialog();persist('Et sammensetningshensyn er lagt til.');toast('Hensynet er lagret. Lag et nytt forslag for å bruke det.');}
 else if(form.id==='restrictionForm'){const start=dayIndex(String(fd.get('start'))),end=dayIndex(String(fd.get('end'))),employee=String(fd.get('employee')),skill=String(fd.get('skill'));if(!Number.isInteger(start)||!Number.isInteger(end)||start<0||end>=DAYS||end<start||!empById(state,employee)||!['response','medication'].includes(skill)){formError('Velg medarbeider, oppgave og gyldige datoer innenfor demoperioden.');return;}if(state.restrictions.some(r=>r.employee===employee&&r.skill===skill&&r.start<=end&&r.end>=start)){formError('Det finnes allerede tilrettelegging for denne oppgaven i perioden.');return;}if(state.restrictions.length>=500){formError('Demoen støtter inntil 500 oppføringer.');return;}state.restrictions.push({id:uid('t'),employee,skill,start,end});closeDialog();persist(`Tilrettelegging er registrert for ${empById(state,employee).name}. Kompetansen på vaktene er kontrollert på nytt.`);toast('Tilrettelegging er lagret. Vaktene er beholdt.');}
 else if(form.id==='feedbackForm'){state.notes=String(fd.get('notes')||'').slice(0,10000);save();document.getElementById('feedbackStatus').textContent=storageOK?'Innspillene er lagret i denne nettleseren.':'Innspillene er i minnet. Last dem ned før du lukker fanen.';toast('Takk! Innspillene er lagret lokalt.');}
}
function init(){syncTheme();state=load();const hash=location.hash.slice(1);if(views[hash])ui.page=hash;for(const [id,ic] of [['buildingIcon','building'],['leafIcon','leaf'],['profileHelp','help'],['menuIcon','menu'],['feedbackIcon','message'],['helpIcon','help']])document.getElementById(id).innerHTML=icon(ic);render();save();document.addEventListener('click',e=>{const target=e.target.closest('[data-action]');if(target&&!target.disabled){handleAction(target.dataset.action,target).catch(error=>{console.error(error);toast('Handlingen kunne ikke fullføres. Prøv igjen.',true);});}});document.addEventListener('submit',e=>{handleSubmit(e).catch(error=>{console.error(error);formError('Handlingen kunne ikke fullføres. Prøv igjen.');});});document.addEventListener('input',e=>{if(e.target.id==='employeeSearch'){ui.search=e.target.value;clearTimeout(saveTimer);saveTimer=setTimeout(()=>{const pos=e.target.selectionStart;render();const input=document.getElementById('employeeSearch');input?.focus();try{input?.setSelectionRange(pos,pos)}catch{}},160);}});document.addEventListener('change',async e=>{if(e.target.id==='pairMode'){const field=document.getElementById('pairLimitField');field.hidden=e.target.value!=='limit';document.getElementById('pairLimit').disabled=e.target.value!=='limit';}if(e.target.id==='roleFilter'){ui.role=e.target.value;render();}if(e.target.id==='shiftValue')updateShiftCheck();if(e.target.id==='requestType'){document.getElementById('requestStatus').value=e.target.value==='fri'?'pending':'approved';}if(e.target.id==='importFile'){const file=e.target.files?.[0];if(!file)return;if(file.size>1000000){toast('Filen er for stor. Maksimal størrelse er 1 MB.',true);return;}try{const incoming=validateData(JSON.parse(await file.text()));if(confirm('Erstatte den lokale demoplanen med denne sikkerhetskopien?')){state=incoming;closeDialog();ui.search='';ui.role='all';persist('En sikkerhetskopi er importert.');toast('Demoprosjektet er importert.');}}catch(err){toast(err.message||'Filen kunne ikke leses.',true);}finally{e.target.value='';}}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(ui.dialog)closeDialog();else closeMenu();}if(e.key==='Tab'&&ui.dialog){const drawer=document.querySelector('.drawer'),items=[...drawer.querySelectorAll('button:not([disabled]),a[href],input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex="0"]')].filter(x=>x.getClientRects().length);if(!items.length){e.preventDefault();return;}const first=items[0],last=items[items.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement===drawer)){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}});window.addEventListener('hashchange',()=>{const p=location.hash.slice(1);if(views[p])navigate(p);});}
globalThis.VaktLaget={SKILLS,skillStatus,skillAvailable,requiredSkills,pairCount,pairPenalty,candidateScore,planChanges,VERSION,DAYS,START,SHIFTS,TYPES,freshState,generate,metrics,validate,reasons,gaps,hours,target,assigned,needed,repairOptions,applyShift,approveRequest,validateData,csv,get,key,absence,dateAt,isoAt,dateLabel,dayIndex,esc,clone,viewMarkup:(s,page)=>{const previous=state;state=s;try{return views[page]()}finally{state=previous}},viewNames:Object.keys(views)};
if(typeof document!=='undefined')init();
})();
